services:
  web:
    image: ghcr.io/thadeu/voodu-webui:latest
    # build: .              # uncomment to build locally instead of pulling
    restart: unless-stopped
    ports:
      # Host 80 -> container 3000 is Thruster's HTTP listener: it answers the
      # Let's Encrypt HTTP-01 challenge and redirects everything else to
      # HTTPS. Keep the container side on 3000 — the image HEALTHCHECK curls
      # http://localhost:3000/up and turns the container unhealthy otherwise.
      # HOST_PORT is the pre-TLS name, still honoured as a fallback. The one
      # case it cannot cover is a legacy HOST_PORT=443: both entries would
      # then claim host 443 and the container refuses to start. Drop it and
      # set TLS_DOMAIN instead — that is what the 443 mapping is now for.
      - "${HOST_HTTP_PORT:-${HOST_PORT:-80}}:3000"
      - "${HOST_HTTPS_PORT:-443}:443"
    environment:
      RAILS_ENV: production
      # Domain Thruster provisions a Let's Encrypt certificate for. Needs an
      # A record pointing here plus host ports 80 + 443 open. Certificates
      # persist under /rails/storage/thruster (the volume below), so restarts
      # don't re-request them. Empty (TLS_DOMAIN= in .env) = plain HTTP.
      TLS_DOMAIN: ${TLS_DOMAIN-acme.dev}
      # Point at the Let's Encrypt staging directory while testing DNS or
      # firewall rules, so failures don't burn the production rate limit.
      ACME_DIRECTORY: ${ACME_DIRECTORY:-https://acme-v02.api.letsencrypt.org/directory}
      # Which database holds the control plane. Empty = the six SQLite files in
      # the volume below. Set = the PRIMARY moves to Postgres (orgs, users,
      # accounts, memberships, servers, encrypted PATs); cache, queue, cable,
      # metrics and hep stay as files, so THE VOLUME IS STILL REQUIRED. An empty
      # value is treated as unset (config/boot.rb) — this map form always
      # interpolates something.
      DATABASE_URL: ${DATABASE_URL:-}
      # Operator sign-in. Empty = anonymous: no credentials asked, every request
      # runs as one local operator with OWNER rights, which includes reading
      # every server's PAT. That is the self-hosted shape and it assumes a VPN or
      # an access proxy in front — do not publish this port without one. Empty
      # with CLOWK_PUBLISHABLE_KEY set keeps sign-in ON, so upgrading an existing
      # install never drops authentication; use 0 to go anonymous deliberately.
      # Set to 1 for per-person sign-in, and then CLOWK_PUBLISHABLE_KEY is required
      # (the app refuses to boot without it). See config/initializers/clowk.rb.
      CLOWK_ENABLED: ${CLOWK_ENABLED:-}
      CLOWK_PUBLISHABLE_KEY: ${CLOWK_PUBLISHABLE_KEY:-}
      CLOWK_SECRET_KEY: ${CLOWK_SECRET_KEY:-}
      # Silences the anonymous-mode banner when a proxy in front forwards real
      # public client IPs (Cloudflare Access does; Twingate does not).
      VOODU_TRUSTED_PERIMETER: ${VOODU_TRUSTED_PERIMETER:-}
      # Skips the api.clowk.dev lookup on the request path. Optional; the gem
      # derives it from the publishable key when unset.
      CLOWK_SUBDOMAIN_URL: ${CLOWK_SUBDOMAIN_URL:-}
      # Enterprise licence. Empty = the free tier, which is a complete product.
      # Verified offline against a public key in the image; never calls home.
      VOODU_LICENSE: ${VOODU_LICENSE:-}
      VOODU_LICENSE_FILE: ${VOODU_LICENSE_FILE:-}
      # Days of logs kept ON DISK. Never touched by the licence — the licence
      # caps how far back you can search, which is a different number.
      VOODU_RETENTION_DAYS: ${VOODU_RETENTION_DAYS:-}
      WAREHOUSE: ${WAREHOUSE:-1}
      POLLER_SPAWN: ${POLLER_SPAWN:-1}
      POLLER_INTERVAL_SECONDS: ${POLLER_INTERVAL_SECONDS:-15}
      POLLER_LOG_BACKFILL_SECONDS: ${POLLER_LOG_BACKFILL_SECONDS:-86400}
      POLLER_TOKEN: ${POLLER_TOKEN:-}
      SOLID_QUEUE_IN_PUMA: ${SOLID_QUEUE_IN_PUMA:-1}
      LOG_TAIL_ENABLED: ${LOG_TAIL_ENABLED:-1}
      # SECRET_KEY_BASE / ACTIVE_RECORD_ENCRYPTION_* auto-generated on first
      # boot if unset and persisted in the storage volume.
    volumes:
      - voodu_webui_storage:/rails/storage
    extra_hosts:
      # Makes `host.docker.internal` resolve to the Docker host gateway on
      # Linux too (Docker Desktop on macOS/Windows handles this natively).
      # Use it as the address when registering an server that lives on the
      # host or on a sibling VM (Lima, OrbStack, UTM, multipass).
      - "host.docker.internal:host-gateway"
    # `resources` is only a valid service key under `deploy` — at the top level
    # Compose rejects the whole file ("additional properties 'resources' not
    # allowed") and nothing starts. Compose v2 applies deploy.resources.limits
    # to plain `docker compose up`, no swarm involved.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 999M

volumes:
  voodu_webui_storage:

networks:
  default:
    name: voodu_webui_network
