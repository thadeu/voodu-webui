default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # One pool. Everything left here is short-running — log-metrics
    # rollups, alert evaluation, HEP sync, the licence check. The
    # long-running tail consumers that once needed a pool of their own
    # moved into the Go poller, which is not a Solid Queue job at all.
    - queues: "default"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
